name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Gradle permissions
        run: chmod +x gradlew

      - name: Create debug google-services.json
        run: |
          mkdir -p app/src/debug
          echo '${{ secrets.GOOGLE_SERVICES_DEBUG }}' > app/src/debug/google-services.json

      - name: Create release google-services.json
        run: |
          mkdir -p app/src/release
          echo '${{ secrets.GOOGLE_SERVICES_RELEASE }}' > app/src/release/google-services.json

      - name: Android Lint
        run: ./gradlew lint

      - name: Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30